- insert:
    - id: subagent-forge
      name: 'dsh-subagent-forge'
      config:
        toolName: spawn_agent
        forkToolName: fork_agent
        subagentProvider: spawn
        forkProvider: fork
        blockBuiltinDelegation: true
        blockedTools:
          - subagent
          - subagent_fork
        extraDelegationTools:
          - workflow
        emptyPrompt: Begin the task described in your system prompt.
